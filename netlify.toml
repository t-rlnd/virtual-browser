# Netlify ne publie que le bundle de production : dist/ (versionne, construit
# en local par `pnpm build`). Sans cette ligne, Netlify servait la racine du
# depot : sources, docs et package.json compris.
#
# Pas de commande de build : dist/ est deja a jour dans le commit pousse, ce
# qui evite d'installer pnpm/esbuild cote Netlify.
[build]
  publish = "dist"
  command = ""

# Le bundle garde un nom fixe : le navigateur doit revalider a chaque visite
# (reponse 304 via ETag si rien n'a change) pour qu'un deploiement soit visible
# immediatement, sans numero de version a changer dans Webflow.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Anciennes URL encore collees dans Webflow (/dist/..., scroll-video.*) :
# servent le bundle actuel pour ne rien casser au deploiement. Status 200 =
# reecriture transparente, pas de redirection visible.
[[redirects]]
  from = "/scroll-video.js"
  to = "/index.js"
  status = 200

[[redirects]]
  from = "/scroll-video.css"
  to = "/index.css"
  status = 200

[[redirects]]
  from = "/dist/scroll-video.js"
  to = "/index.js"
  status = 200

[[redirects]]
  from = "/dist/scroll-video.css"
  to = "/index.css"
  status = 200

[[redirects]]
  from = "/dist/*"
  to = "/:splat"
  status = 200
