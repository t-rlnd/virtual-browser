<!--
  A coller dans Webflow : Page settings > Inside <head> tag
  (ou Site settings > Custom code > Head si l'animation existe sur plusieurs pages)

  Deux origines, deux roles :
    cdn.jsdelivr.net              le bundle JS/CSS, servi depuis le depot GitHub
    temp-virtual-browser.b-cdn.net  les MP4 et les posters, servis depuis Bunny

  Le numero de version (@v1.8.0) est un tag git. Publier une mise a jour du
  code = pousser un nouveau tag, puis changer ce numero ici ET dans
  footer.html. Tant qu'il ne change pas, jsDelivr sert le fichier depuis son
  cache permanent.

  Ajouter `?dev` a l'URL bascule sur `pnpm dev` (localhost:3000) : le site
  publie sert alors le bundle en cours d'ecriture, sans republier la page.
  Sans `?dev`, c'est toujours jsDelivr — un visiteur ne voit jamais localhost.
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://temp-virtual-browser.b-cdn.net" crossorigin />

<script>
  /* Insere la feuille dans le <head> pendant le parsing : elle bloque le
     rendu comme un <link> ecrit en dur, donc pas de flash de page non stylee.
     Le meme drapeau est relu dans footer.html pour le script. */
  (function () {
    window.VB_DEV = new URLSearchParams(location.search).has('dev');

    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = window.VB_DEV
      ? 'http://localhost:3000/dev/scroll-video.css'
      : 'https://cdn.jsdelivr.net/gh/t-rlnd/virtual-browser@v1.8.0/dist/scroll-video.css';
    document.head.appendChild(link);
  })();
</script>

<!--
  Masque la page tant que la premiere image n'est pas decodee, pour eviter le
  flash de fond noir. Le script retire cet etat en posant data-vb-state.
-->
<style>
  [data-vb-loader] {
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: inherit;
  }
</style>
