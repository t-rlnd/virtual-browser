<!--
  A coller dans Webflow : Site settings > Custom code > Head code (toutes les
  pages : le bundle porte aussi le smooth scroll Lenis, et n'active le Heros
  et Protocol que la ou leur structure existe)

  Deux origines, deux roles :
    virtual-browser.netlify.app     le bundle JS/CSS, deploye depuis dist/ a chaque push
    virtual-browser.b-cdn.net       les MP4 et les posters, servis depuis Bunny

  Pas de numero de version : l'URL est fixe, un push sur main suffit a
  publier (Netlify force la revalidation, voir netlify.toml).

  Ajouter `?dev` a l'URL bascule sur `pnpm dev` (localhost:3000) : le site
  publie sert alors le bundle en cours d'ecriture, sans republier la page.
  Sans `?dev`, c'est toujours Netlify — un visiteur ne voit jamais localhost.
-->

<link rel="preconnect" href="https://virtual-browser.netlify.app" crossorigin />
<link rel="preconnect" href="https://virtual-browser.b-cdn.net" crossorigin />

<script>
  /* Insere la feuille dans le <head> pendant le parsing : elle bloque le
     rendu comme un <link> ecrit en dur, donc pas de flash de page non stylee.
     Le meme drapeau est relu dans footer.html pour le script. */
  (function () {
    window.VB_DEV = new URLSearchParams(location.search).has('dev');

    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = window.VB_DEV
      ? 'http://localhost:3000/dev/index.css'
      : 'https://virtual-browser.netlify.app/index.css';
    document.head.appendChild(link);
  })();
</script>

<!--
  Masque la page tant que la premiere image n'est pas decodee, pour eviter le
  flash de fond noir. Le script retire cet etat en posant data-vb-state.
-->
<style>
  [data-vb-loader] {
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: inherit;
  }

  /* Textes du Heros : seule la premiere etape est lisible avant le script.
     Double de hero.css, mais ecrit en dur ici : la feuille ci-dessus, inseree
     par script, ne bloque pas le rendu, d'ou un flash des trois textes
     superposes. `visibility` et non `display` : SplitText doit pouvoir
     mesurer les lignes. */
  [data-vb-hero-step]:not([data-vb-hero-step='0']) {
    visibility: hidden;
  }
</style>
