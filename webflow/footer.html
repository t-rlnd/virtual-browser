<!--
  A coller dans Webflow : Site settings > Custom code > Footer code (toutes
  les pages, voir head.html)

  L'ordre compte : gsap, puis ScrollTrigger et SplitText, puis le script
  d'animation qui les lit depuis window. SplitText decoupe les textes du
  Heros en lignes ; sans lui, ils basculent d'un bloc.

  `?dev` bascule sur `pnpm dev` (localhost:3000), voir head.html.
-->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>

<script>
  /* gsap et ScrollTrigger sont des scripts bloquants : ils ont fini de
     s'executer quand celui-ci tourne. Le bundle peut donc partir tout de
     suite, le DOM etant deja parse a hauteur de </body>. */
  (function () {
    var dev = window.VB_DEV ?? new URLSearchParams(location.search).has('dev');

    var script = document.createElement('script');
    script.src = dev
      ? 'http://localhost:3000/dev/index.js'
      : 'https://dev-vb.initweb.ai/index.js';
    // Preserve l'ordre d'execution si un autre script est injecte de la meme
    // facon plus tard : sans ca, le premier arrive est le premier servi.
    script.async = false;
    document.body.appendChild(script);
  })();
</script>
