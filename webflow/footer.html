<!--
  A coller dans Webflow : Page settings > Before </body> tag

  L'ordre compte : gsap, puis ScrollTrigger, puis le script d'animation qui
  les lit depuis window.

  Le tag de version doit rester identique a celui de head.html.

  `?dev` bascule sur `pnpm dev` (localhost:3000), voir head.html.
-->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>

<script>
  /* gsap et ScrollTrigger sont des scripts bloquants : ils ont fini de
     s'executer quand celui-ci tourne. Le bundle peut donc partir tout de
     suite, le DOM etant deja parse a hauteur de </body>. */
  (function () {
    var dev = window.VB_DEV ?? new URLSearchParams(location.search).has('dev');

    var script = document.createElement('script');
    script.src = dev
      ? 'http://localhost:3000/dev/scroll-video.js'
      : 'https://cdn.jsdelivr.net/gh/t-rlnd/virtual-browser@v1.8.0/dist/scroll-video.js';
    // Preserve l'ordre d'execution si un autre script est injecte de la meme
    // facon plus tard : sans ca, le premier arrive est le premier servi.
    script.async = false;
    document.body.appendChild(script);
  })();
</script>
