<!doctype html>
<!--
  Verification du bundle de production tel qu'il sera charge par Webflow.

  Reproduit la structure decrite dans docs/webflow-setup.md, charge
  dist/scroll-video.js et laisse le bundle tirer les videos du vrai CDN : ce
  que fera la page Webflow, aux URL jsDelivr pres.

  Le serveur de developpement sert dist/ sans le transformer, cette page
  charge donc bien le bundle de production.

      pnpm build
      pnpm dev                 # puis http://localhost:3000/demo/bundle.html
-->
<html lang="fr" data-vb-state="loading">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bundle de production — verification</title>
    <link rel="stylesheet" href="/dist/scroll-video.css" />
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #fff;
        background: #05070c;
      }
      /* Montage superpose : une piste, un conteneur colle, trois calques. */
      [data-vb-scrub] {
        position: relative;
        z-index: 1;
        height: 300vh;
      }
      [data-vb-scrub-inner] {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: hidden;
      }
      [data-vb-stage] {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-color: rgb(0 0 0 / calc(1 - var(--vb-dock)));
      }
      .intro {
        z-index: 1;
        opacity: calc(1 - var(--vb-scrub, 0) / 0.2);
      }
      [data-vb-loop] {
        z-index: 2;
        opacity: calc((var(--vb-scrub, 0) - 0.3) / 0.3);
        pointer-events: none;
      }
      :root[data-vb-mode='loop'] [data-vb-loop] {
        pointer-events: auto;
      }
      .intro,
      [data-vb-loop] {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1rem;
        text-align: center;
      }
      .pins {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        opacity: calc((var(--vb-scrub, 0) - 0.8) / 0.2);
      }
      /* Reperage de la position que prend le fond video pendant la boucle. */
      [data-vb-frame] {
        width: min(720px, 80vw);
        aspect-ratio: 16 / 9;
        border: 2px dashed rgba(255, 45, 45, 0.9);
      }
      @media (max-width: 991px) {
        [data-vb-scrub] {
          height: auto;
        }
        [data-vb-scrub-inner] {
          position: relative;
          height: auto;
          overflow: visible;
        }
        .intro,
        [data-vb-loop] {
          position: relative;
          inset: auto;
          opacity: 1;
          pointer-events: auto;
        }
        .pins {
          opacity: 1;
        }
      }
      .after {
        position: relative;
        z-index: 1;
        min-height: 150vh;
        background: #05070c;
        display: grid;
        place-content: center;
      }
      [data-vb-loader] {
        background: #05070c;
        display: grid;
        place-content: center;
      }
    </style>
  </head>

  <body>
    <div data-vb-loader>chargement…</div>

    <section data-vb-scrub>
      <div data-vb-scrub-inner>
        <div data-vb-stage>
          <video data-vb-video="v1" data-vb-file="video1" data-vb-transition="166" data-vb-end="398"></video>
          <video data-vb-video="v2" data-vb-file="video2" data-vb-transition="116" data-vb-end="247"></video>
        </div>

        <div class="intro"><h1>Section 1</h1></div>

        <div data-vb-loop>
          <h1>Section 2</h1>
          <div>
            <button type="button" data-vb-usecase="v1">Use case 1</button>
            <button type="button" data-vb-usecase="v2">Use case 2</button>
          </div>
          <div data-vb-when="v1">cards v1 · legende 1</div>
          <div data-vb-when="v2">cards v2 · legende 2</div>
          <div data-vb-frame>
            <div class="pins"><span>1</span><span>2</span><span>3</span></div>
          </div>
        </div>
      </div>
    </section>

    <section class="after"><h1>Suite du site</h1></section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script defer src="/dist/scroll-video.js"></script>
  </body>
</html>
